<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Search for country</h1>
    <div>
        <template id="place-template">
            <ul>
                <li class="place-name"></li>
                <li class="location"></li>
                <li class="country"></li>
                <li class="continent"></li>
                <li class="open-to-public"></li>
                <li class="fun-fact"></li>
            </ul>
        </template>
        <input type="search" name="" id="search">
        <button id="btn">Click me</button>
    </div>
    <div id="places-area"></div>
</body>
<script>
    const btn = document.getElementById("btn")
    const search = document.getElementById("search")
    const place_area = document.getElementById("places-area")

    async function getData() {
        const response = await fetch(`http://localhost:8000/api/country/${search.value}`)
        const data = await response.json()
        return await data
    }

    function createPlaces(data) {
        const element = document.getElementById("place-template").content.cloneNode(true)

        const name = element.querySelector(".place-name")
        const location = element.querySelector(".location")
        const country = element.querySelector(".country")
        const continent = element.querySelector(".continent")
        const open_to_public = element.querySelector(".open-to-public")
        const fun_fact = element.querySelector(".fun-fact")

        name.textContent = `Name: ${data.name}`
        location.textContent = `Location: ${data.location}`
        country.textContent = `Country: ${data.country}`
        continent.textContent = `Continent: ${data.continent}`

        open_to_public.textContent = `Open to public: ${data.is_open_to_public ? "Yes" : "No"}`
        fun_fact.textContent = `Fun fact: ${data.details[0].fun_fact}`

        return element
    }

    btn.addEventListener("click", async () => {
        const data = await getData()
        console.log(data)
        place_area.innerHTML = ""
        if (data === "404") {
            place_area.innerHTML = `<p>404 - The country ${search.value} not found :/`
        }
        else {
            data.forEach((entry) => {
                const element = createPlaces(entry)
                place_area.appendChild(element)
            })
        }

    })

</script>
</html>
